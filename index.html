<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mevzuat Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #okuyucuModu { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; }
        iframe { width: 100%; height: calc(100vh - 120px); border: none; }
        /* Vurgulama Rengi */
        .highlight { background-color: #fef08a; color: #1e40af; font-weight: bold; padding: 0 2px; border-radius: 4px; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-gray-50">

    <div id="anaSayfa" class="pb-10">
        <nav class="bg-blue-900 text-white p-4 sticky top-0 shadow-xl z-30">
            <div class="max-w-4xl mx-auto text-center">
                <h1 class="text-lg font-bold tracking-widest uppercase">Mevzuat Rehberi</h1>
                <div class="relative mt-3">
                    <input type="text" id="ara" placeholder="Kanun, madde veya içerik ara..." 
                           class="w-full p-4 rounded-xl text-black outline-none focus:ring-4 focus:ring-yellow-500 shadow-inner pr-12">
                    <div class="absolute right-4 top-4 text-blue-900" id="loading">🔍</div>
                </div>
                <div id="sayac" class="text-xs mt-2 text-blue-200 font-medium">Veriler hazırlanıyor...</div>
            </div>
        </nav>

        <div id="sonuclar" class="p-4 space-y-4 max-w-4xl mx-auto">
            </div>
    </div>

    <div id="okuyucuModu">
        <div class="bg-slate-100 p-2 border-b flex flex-col gap-2 shadow-md">
            <div class="flex justify-between items-center px-2">
                <button onclick="kapat()" class="bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-bold">← Geri</button>
                <div class="flex gap-2">
                    <button onclick="paylas()" class="bg-blue-600 text-white p-2 rounded-lg text-sm">Paylaş</button>
                    <button onclick="favoriEkle()" class="bg-amber-500 text-white p-2 rounded-lg text-sm font-bold">⭐</button>
                </div>
            </div>
            <div class="flex gap-2 px-2">
                <input type="text" id="sayfaIciAra" placeholder="Sayfada kelime bul..." class="flex-grow p-2 border rounded-lg outline-none focus:border-blue-500 text-sm">
                <button onclick="sayfadaAra()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-bold">Bul</button>
            </div>
        </div>
        <iframe id="mevzuatFrame" src=""></iframe>
    </div>

    <script>
        let veri = [];
        let aramaTimer;

        // 1. Veriyi Çek
        fetch('ara_verisi.json')
            .then(r => r.json())
            .then(d => { 
                veri = d; 
                document.getElementById('sayac').innerText = `${veri.length} mevzuat yüklendi.`;
                ekranaBas(veri, ""); 
            });

        // 2. Metni Vurgulama Fonksiyonu
        function vurgula(metin, kelime) {
            if (!kelime || kelime.length < 2) return metin;
            const regex = new RegExp(`(${kelime.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return metin.replace(regex, '<span class="highlight">$1</span>');
        }

        // 3. Listeleme
        function ekranaBas(liste, anahtar) {
            const div = document.getElementById('sonuclar');
            const sayac = document.getElementById('sayac');
            div.innerHTML = "";
            
            sayac.innerText = `${liste.length} sonuç bulundu.`;

            // Performans için ilk 60 sonucu göster
            liste.slice(0, 60).forEach(s => {
                const kart = document.createElement('div');
                kart.className = "bg-white p-5 rounded-xl shadow-sm border border-gray-200 hover:border-blue-400 transition cursor-pointer";
                
                const temizBaslik = s.baslik.replace(/\.[^/.]+$/, "");
                const vurguluBaslik = vurgula(temizBaslik, anahtar);
                const onizleme = s.icerik ? s.icerik.substring(0, 250) + "..." : "İçerik yok.";
                const vurguluIcerik = vurgula(onizleme, anahtar);

                kart.innerHTML = `
                    <h3 class="font-bold text-blue-900 text-md leading-tight">${vurguluBaslik}</h3>
                    <p class="text-sm text-gray-500 mt-2 line-clamp-3">${vurguluIcerik}</p>
                `;
                kart.onclick = () => ac(s.yol);
                div.appendChild(kart);
            });
        }

        // 4. Ana Arama Mantığı
        document.getElementById('ara').addEventListener('input', (e) => {
            const anahtar = e.target.value.toLowerCase('tr').trim();
            clearTimeout(aramaTimer);

            aramaTimer = setTimeout(() => {
                const sonuclar = veri.filter(item => 
                    item.baslik.toLowerCase('tr').includes(anahtar) || 
                    item.icerik.toLowerCase('tr').includes(anahtar)
                );
                ekranaBas(sonuclar, anahtar);
            }, 300);
        });

        // --- OKUYUCU FONKSİYONLARI ---
        function ac(yol) {
            document.getElementById('anaSayfa').style.display = 'none';
            document.getElementById('okuyucuModu').style.display = 'block';
            document.getElementById('mevzuatFrame').src = yol;
            window.suAnkiYol = window.location.origin + window.location.pathname.replace('index.html','') + yol;
        }

        function kapat() {
            document.getElementById('okuyucuModu').style.display = 'none';
            document.getElementById('anaSayfa').style.display = 'block';
        }

        function sayfadaAra() {
            const kelime = document.getElementById('sayfaIciAra').value;
            if(kelime) window.frames[0].window.find(kelime);
        }

        function paylas() {
            if (navigator.share) {
                navigator.share({ title: 'Mevzuat', url: window.suAnkiYol });
            } else {
                alert("Link: " + window.suAnkiYol);
            }
        }

        function favoriEkle() {
            alert("Favorilere eklendi!");
        }
    </script>
</body>
</html>
