<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Mevzuat Pro - İçerik Arama</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="p-5">
        <input type="text" id="ara" placeholder="İçerik içinde ara (örn: disiplin cezası)..." 
               class="w-full p-4 rounded-xl border-2 border-blue-500 shadow-lg">
        <div id="sonuclar" class="mt-5 space-y-3"></div>
    </div>

    <script>
        let veri = [];

        // Python ile oluşturduğumuz dev dosyayı bir kere çekiyoruz
        fetch('ara_verisi.json')
            .then(r => r.json())
            .then(d => { veri = d; console.log("Veri hazır!"); });

        document.getElementById('ara').addEventListener('input', (e) => {
            const anahtar = e.target.value.toLowerCase('tr');
            const liste = document.getElementById('sonuclar');
            liste.innerHTML = "";

            if (anahtar.length < 3) return; // 3 harften azsa arama yapma

            const sonuclar = veri.filter(item => 
                item.baslik.toLowerCase('tr').includes(anahtar) || 
                item.icerik.toLowerCase('tr').includes(anahtar)
            );

            sonuclar.slice(0, 50).forEach(s => { // İlk 50 sonucu göster
                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded shadow cursor-pointer hover:bg-blue-50";
                div.innerHTML = `<strong>${s.baslik}</strong><br><small class='text-gray-500'>${s.icerik.substring(0, 150)}...</small>`;
                div.onclick = () => window.location.href = s.yol;
                liste.appendChild(div);
            });
        });
    </script>
</body>
</html>
