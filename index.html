<div id="okuyucuModu">
    <div class="bg-white border-b sticky top-0 shadow-md p-3 z-50">
        <div class="flex justify-between items-center max-w-4xl mx-auto mb-2">
            <button onclick="kapat()" class="bg-gray-800 text-white px-5 py-2 rounded-lg font-bold hover:bg-black transition">← GERİ</button>
            <div class="flex gap-2">
                <button onclick="paylas()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium">Paylaş</button>
                <button onclick="favoriEkle()" class="bg-amber-500 text-white px-4 py-2 rounded-lg text-sm font-medium">⭐ Favori</button>
            </div>
        </div>
        
        <div class="max-w-4xl mx-auto flex flex-wrap gap-2 items-center bg-gray-50 p-2 rounded-xl border border-gray-200">
            <div class="relative flex-grow">
                <input type="text" id="sayfaIciAra" placeholder="Kanun içinde ara..." 
                       class="w-full p-3 pr-20 border-2 border-blue-100 rounded-lg outline-none focus:border-blue-500 transition">
                <span id="bulunanAdet" class="absolute right-3 top-3.5 text-blue-600 font-bold text-sm bg-blue-50 px-2 py-0.5 rounded border border-blue-200">
                    0/0
                </span>
            </div>
            
            <button onclick="siradakiEslasme()" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold shadow-md hover:bg-blue-700 active:scale-95 transition flex items-center gap-2">
                <span>Sıradaki</span>
                <span class="text-xs">▼</span>
            </button>
        </div>
    </div>
    
    <div id="mevzuatIcerik" class="max-w-4xl mx-auto bg-white shadow-sm min-h-screen pb-20">
        </div>
</div>

<script>
    // GEREKLİ DEĞİŞKENLER
    let tumEslasmeler = [];
    let aktifIndeks = -1;

    // SAYFA İÇİ ARAMA VE BOYAMA FONKSİYONU
    document.getElementById('sayfaIciAra').addEventListener('input', function() {
        const kelime = this.value.trim();
        const icerikDiv = document.getElementById('mevzuatIcerik');
        const adetGosterge = document.getElementById('bulunanAdet');
        
        // Sıfırlama
        aktifIndeks = -1;
        tumEslasmeler = [];
        
        // Önceki vurguları temizle (HTML yapısını bozmadan metni geri getir)
        const temizMetin = icerikDiv.innerHTML.replace(/<mark class="highlight( active-highlight)?">|<\/mark>/g, "");
        icerikDiv.innerHTML = temizMetin;

        if (kelime.length < 2) {
            adetGosterge.innerText = "0/0";
            return;
        }

        // Büyük/Küçük harf duyarsız arama
        const regex = new RegExp(`(${kelime})`, 'gi');
        
        // İçeriği boyayarak yeniden yaz
        icerikDiv.innerHTML = icerikDiv.innerHTML.replace(regex, `<mark class="highlight">$1</mark>`);

        // Tüm boyananları listeye al
        tumEslasmeler = icerikDiv.querySelectorAll('.highlight');
        
        if (tumEslasmeler.length > 0) {
            aktifIndeks = 0;
            guncelleVeOdaklan();
        } else {
            adetGosterge.innerText = "0/0";
        }
    });

    // SIRADAKİ EŞLEŞMEYE GİT
    function siradakiEslasme() {
        if (tumEslasmeler.length === 0) return;

        // Eski aktifi temizle
        if (aktifIndeks >= 0) {
            tumEslasmeler[aktifIndeks].classList.remove('active-highlight');
        }

        // Bir sonrakine geç (sona gelirse başa dön)
        aktifIndeks = (aktifIndeks + 1) % tumEslasmeler.length;
        
        guncelleVeOdaklan();
    }

    // GÖRÜNÜMÜ GÜNCELLE VE ODAKLAN
    function guncelleVeOdaklan() {
        const hedef = tumEslasmeler[aktifIndeks];
        const adetGosterge = document.getElementById('bulunanAdet');

        // Mevcut olanı belirginleştir (Turuncu yap)
        hedef.classList.add('active-highlight');
        
        // Sayacı güncelle (Örn: 3/15)
        adetGosterge.innerText = `${aktifIndeks + 1}/${tumEslasmeler.length}`;

        // Yumuşak kaydırma ile kelimeye odaklan
        hedef.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // CSS EKLEMESİ (Style etiketinin içine ekle)
    /*
    .active-highlight { 
        background-color: #f59e0b !important; 
        border: 2px solid #000 !important; 
        box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
    }
    */
</script>
