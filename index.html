<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mevzuat Pro - Profesyonel Okuyucu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #okuyucuModu { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; overflow-y: auto; }
        
        /* Arama Vurguları */
        .highlight { background-color: #fef08a; color: #1e40af; font-weight: bold; padding: 0 2px; border-radius: 2px; }
        .active-highlight { 
            background-color: #f59e0b !important; 
            color: white !important;
            border: 2px solid #b45309 !important; 
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
            transform: scale(1.05);
            display: inline-block;
        }

        /* Temiz Metin Görünümü */
        #mevzuatIcerik { 
            line-height: 1.8; 
            font-size: 1.15rem; 
            color: #1f2937; 
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        }
        #mevzuatIcerik p, #mevzuatIcerik div { margin-bottom: 1.2rem !important; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 antialiased">

    <div id="anaSayfa">
        <nav class="bg-blue-900 text-white p-5 sticky top-0 shadow-2xl z-30">
            <div class="max-w-4xl mx-auto text-center">
                <h1 class="text-xl font-black tracking-widest uppercase mb-4">MEVZUAT REHBERİ</h1>
                <div class="relative">
                    <input type="text" id="anaAra" placeholder="Arşivde hızlı ara..." 
                           class="w-full p-4 pl-12 rounded-2xl text-black shadow-inner outline-none focus:ring-4 focus:ring-blue-400 transition-all">
                    <span class="absolute left-4 top-4.5 opacity-40 text-xl">🔍</span>
                </div>
                <div id="toplamSayi" class="text-xs mt-3 text-blue-300 font-bold tracking-tighter uppercase tracking-widest">Yükleniyor...</div>
            </div>
        </nav>
        <div id="anaListe" class="p-4 max-w-4xl mx-auto space-y-4"></div>
    </div>

    <div id="okuyucuModu">
        <header class="bg-white border-b sticky top-0 shadow-lg p-3 z-50">
            <div class="max-w-5xl mx-auto">
                <div class="flex justify-between items-center mb-3">
                    <button onclick="kapat()" class="bg-slate-800 text-white px-6 py-2 rounded-xl font-bold shadow-md hover:bg-black transition">← GERİ</button>
                    <div class="flex gap-2">
                        <button onclick="paylas()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm">Paylaş</button>
                        <button onclick="favoriEkle()" class="bg-amber-500 text-white px-4 py-2 rounded-xl text-sm font-bold">⭐</button>
                    </div>
                </div>
                
                <div class="flex gap-2 items-center bg-slate-50 p-2 rounded-2xl border border-slate-200">
                    <div class="relative flex-grow">
                        <input type="text" id="sayfaIciAra" placeholder="Kanun içinde bul..." 
                               class="w-full p-3 pr-20 rounded-xl border-2 border-slate-200 outline-none focus:border-blue-500">
                        <span id="sayfaSayac" class="absolute right-3 top-3.5 bg-blue-100 text-blue-700 font-bold text-xs px-2 py-1 rounded-md border border-blue-200">
                            0/0
                        </span>
                    </div>
                    <button onclick="siradaki()" class="bg-blue-600 text-white px-5 py-3 rounded-xl font-bold shadow-md hover:bg-blue-700 active:scale-95 transition">
                        Sıradaki
                    </button>
                </div>
            </div>
        </header>
        
        <main id="mevzuatIcerik" class="max-w-4xl mx-auto bg-white p-8 shadow-sm min-h-screen">
            </main>
    </div>

    <script>
        let tumVeri = [];
        let sayfaEslasme = [];
        let aktifEslasmeIndeks = -1;
        let aramaTimer;

        // 1. Veriyi Çek
        fetch('ara_verisi.json')
            .then(r => r.json())
            .then(data => {
                tumVeri = data;
                document.getElementById('toplamSayi').innerText = `${tumVeri.length} MEVZUAT KAYDI HAZIR`;
                listeYenile(tumVeri);
            });

        // 2. Ana Liste Güncelleme
        function listeYenile(liste) {
            const container = document.getElementById('anaListe');
            container.innerHTML = "";
            liste.slice(0, 100).forEach(item => {
                const kart = document.createElement('div');
                kart.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:border-blue-500 hover:shadow-md cursor-pointer transition-all";
                kart.innerHTML = `
                    <h3 class="text-blue-900 font-black text-md leading-tight mb-2">${item.baslik.replace('.html','')}</h3>
                    <p class="text-slate-500 text-sm line-clamp-2">${item.icerik.substring(0,180)}...</p>
                `;
                kart.onclick = () => kanunAc(item.yol);
                container.appendChild(kart);
            });
        }

        // 3. Ana Arama
        document.getElementById('anaAra').addEventListener('input', (e) => {
            const kelime = e.target.value.toLocaleLowerCase('tr').trim();
            clearTimeout(aramaTimer);
            aramaTimer = setTimeout(() => {
                const filtre = tumVeri.filter(m => 
                    m.baslik.toLocaleLowerCase('tr').includes(kelime) || 
                    m.icerik.toLocaleLowerCase('tr').includes(kelime)
                );
                listeYenile(filtre);
            }, 300);
        });

        // 4. KANUNU AÇ VE WORD ÇÖPLERİNİ TEMİZLE
        async function kanunAc(yol) {
            document.getElementById('anaSayfa').style.display = 'none';
            document.getElementById('okuyucuModu').style.display = 'block';
            const icerikDiv = document.getElementById('mevzuatIcerik');
            icerikDiv.innerHTML = "<div class='text-center py-20 text-slate-400 animate-pulse font-bold'>Metin Çözümleniyor...</div>";

            try {
                const res = await fetch(yol);
                let html = await res.text();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // Gereksiz Word/Kod etiketlerini temizle
                const gereksizler = doc.querySelectorAll('style, script, head, link, meta, xml, object');
                gereksizler.forEach(s => s.remove());
                
                // HER ŞEYİ BOZAN STYLE VE FONT KODLARINI SİL (Sadece Saf Metni Bırak)
                const tumElementler = doc.querySelectorAll('*');
                tumElementler.forEach(el => {
                    el.removeAttribute('style');
                    el.removeAttribute('class');
                    el.removeAttribute('lang');
                    el.removeAttribute('face'); // Font face temizliği
                });

                icerikDiv.innerHTML = doc.body.innerHTML;
                window.suAnkiUrl = window.location.origin + window.location.pathname.replace('index.html','') + yol;
                
                // Aramayı sıfırla
                document.getElementById('sayfaIciAra').value = "";
                document.getElementById('sayfaSayac').innerText = "0/0";
                window.scrollTo(0,0);
            } catch (err) {
                icerikDiv.innerHTML = "<div class='p-10 text-red-500 font-bold'>Hata: Kanun içeriği yüklenemedi.</div>";
            }
        }

        // 5. SAYFA İÇİ GELİŞMİŞ ARAMA
        document.getElementById('sayfaIciAra').addEventListener('input', function() {
            const kelime = this.value.trim();
            const icerikDiv = document.getElementById('mevzuatIcerik');
            const sayac = document.getElementById('sayfaSayac');

            aktifEslasmeIndeks = -1;
            sayfaEslasme = [];
            
            // Boyamaları temizle
            const temizMetin = icerikDiv.innerHTML.replace(/<mark class="highlight( active-highlight)?">|<\/mark>/g, "");
            icerikDiv.innerHTML = temizMetin;

            if (kelime.length < 2) {
                sayac.innerText = "0/0";
                return;
            }

            const regex = new RegExp(`(${kelime})`, 'gi');
            icerikDiv.innerHTML = icerikDiv.innerHTML.replace(regex, `<mark class="highlight">$1</mark>`);

            sayfaEslasme = icerikDiv.querySelectorAll('.highlight');
            
            if (sayfaEslasme.length > 0) {
                aktifEslasmeIndeks = 0;
                odaklan();
            } else {
                sayac.innerText = "0/0";
            }
        });

        // 6. SIRADAKİ EŞLEŞME
        function siradaki() {
            if (sayfaEslasme.length === 0) return;
            sayfaEslasme[aktifEslasmeIndeks].classList.remove('active-highlight');
            aktifEslasmeIndeks = (aktifEslasmeIndeks + 1) % sayfaEslasme.length;
            odaklan();
        }

        function odaklan() {
            const hedef = sayfaEslasme[aktifEslasmeIndeks];
            hedef.classList.add('active-highlight');
            document.getElementById('sayfaSayac').innerText = `${aktifEslasmeIndeks + 1}/${sayfaEslasme.length}`;
            hedef.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function kapat() {
            document.getElementById('okuyucuModu').style.display = 'none';
            document.getElementById('anaSayfa').style.display = 'block';
        }

        function paylas() {
            navigator.share({ title: 'Mevzuat Paylaş', url: window.suAnkiUrl });
        }

        function favoriEkle() {
            alert("Favorilere Eklendi!");
        }
    </script>
</body>
</html>
