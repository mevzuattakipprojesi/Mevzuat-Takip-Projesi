<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mevzuat Pro - Profesyonel Arama</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-blue-900 text-white p-4 shadow-xl sticky top-0 z-50">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-xl font-bold text-center mb-3">MEVZUAT REHBERİ</h1>
            <div class="relative">
                <input type="text" id="ara" placeholder="Başlık veya içerik içinde ara (Örn: disiplin)..." 
                       class="w-full p-4 rounded-xl text-black outline-none focus:ring-4 focus:ring-yellow-500 shadow-inner">
                <div id="yuklemeStatus" class="absolute right-4 top-4 text-blue-900 font-bold hidden">
                    <span class="animate-spin inline-block">⏳</span>
                </div>
            </div>
            <div id="bilgi" class="text-xs mt-2 text-center text-blue-200">Veriler yükleniyor...</div>
        </div>
    </nav>

    <div id="sonuclar" class="p-4 max-w-4xl mx-auto space-y-3">
        </div>

    <script>
        let veri = [];
        let aramaTimer;
        const sonuclarDiv = document.getElementById('sonuclar');
        const bilgiDiv = document.getElementById('bilgi');
        const yuklemeStatus = document.getElementById('yuklemeStatus');

        // 1. Veriyi Çek ve İlk Listelemeyi Yap
        fetch('ara_verisi.json')
            .then(r => r.json())
            .then(d => { 
                veri = d; 
                bilgiDiv.innerText = `${veri.length} adet mevzuat dosyası hazır.`;
                ekranaBas(veri); // Sayfa açılınca hepsini göster
            })
            .catch(err => {
                bilgiDiv.innerText = "Veri yüklenemedi! (ara_verisi.json bulunamadı)";
                console.error(err);
            });

        // 2. Performanslı Arama Fonksiyonu (Debounce)
        document.getElementById('ara').addEventListener('input', (e) => {
            const anahtar = e.target.value.toLowerCase('tr').trim();
            
            // Kullanıcı yazarken eski zamanlayıcıyı iptal et
            clearTimeout(aramaTimer);
            yuklemeStatus.classList.remove('hidden');

            aramaTimer = setTimeout(() => {
                if (anahtar.length === 0) {
                    ekranaBas(veri); // Arama kutusu boşsa tüm listeyi geri getir
                    yuklemeStatus.classList.add('hidden');
                    return;
                }

                // Arama İşlemi (Performans için filter döngüsü)
                const sonuclar = veri.filter(item => 
                    item.baslik.toLowerCase('tr').includes(anahtar) || 
                    item.icerik.toLowerCase('tr').includes(anahtar)
                );

                ekranaBas(sonuclar);
                bilgiDiv.innerText = `${sonuclar.length} sonuç bulundu.`;
                yuklemeStatus.classList.add('hidden');
            }, 250); // 250 milisaniye bekle (yazma hızı toleransı)
        });

        // 3. Ekrana Basma Fonksiyonu (Optimize Edilmiş)
        function ekranaBas(liste) {
            sonuclarDiv.innerHTML = "";
            
            // Performans için: Eğer sonuç çok fazlaysa sadece ilk 100'ü göster
            const gösterilecekListe = liste.slice(0, 100);

            gösterilecekListe.forEach(s => {
                const kart = document.createElement('div');
                kart.className = "bg-white p-4 rounded-lg shadow border-l-4 border-blue-900 hover:bg-blue-50 transition cursor-pointer";
                
                // Başlıktaki uzantıyı temizle
                const temizBaslik = s.baslik.replace(/\.[^/.]+$/, "");
                
                // İçerik önizlemesi (Madde kısımlarını daha temiz gösterir)
                const onizleme = s.icerik ? s.icerik.substring(0, 180) + "..." : "İçerik önizlemesi yok.";

                kart.innerHTML = `
                    <h3 class="font-bold text-blue-900 text-lg leading-tight">${temizBaslik}</h3>
                    <p class="text-sm text-gray-600 mt-2">${onizleme}</p>
                `;
                
                kart.onclick = () => window.location.href = s.yol;
                sonuclarDiv.appendChild(kart);
            });

            if (liste.length > 100) {
                const uyari = document.createElement('p');
                uyari.className = "text-center text-gray-400 text-sm py-4";
                uyari.innerText = "Devamı için lütfen aramayı daraltın...";
                sonuclarDiv.appendChild(uyari);
            }
        }
    </script>
</body>
</html>
